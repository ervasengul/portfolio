<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Welcome - Erva Şengül</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: #f5f5f0;
            color: #2d5016;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .welcome-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .welcome-title {
            font-family: var(--font-body);
            font-size: 5rem;
            font-weight: 400;
            color: #4a7c59;
            margin-bottom: 1rem;
            
            animation: fadeInDown 1s ease-out;
        }

        .welcome-subtitle {
            font-family: var(--font-body);
            font-size: 2rem;
            font-weight: 400;
            color: #2d5016;
            margin-bottom: 1rem;
            
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .welcome-name {
            font-family: var(--font-body);
            font-size: 2.5rem;
            font-weight: 400;
            color: #4a7c59;
            margin-bottom: 0.75rem;
            
            animation: fadeInUp 1s ease-out 0.5s backwards;
        }

        .welcome-role {
            font-family: var(--font-body);
            font-size: 1.5rem;
            font-weight: 400;
            color: #2d5016;
            margin-bottom: 3rem;
            
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        .projects-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-family: var(--font-body);
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            background: #4a7c59;
            border: none;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeInUp 1s ease-out 0.7s backwards;
        }

        .projects-button:hover {
            background: #2d5016;
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* Floating decorative elements */
        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            font-size: 5rem;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 20%;
            right: 15%;
            font-size: 4rem;
            animation-delay: 1s;
        }

        .floating-element:nth-child(3) {
            bottom: 15%;
            left: 20%;
            font-size: 6rem;
            animation-delay: 2s;
        }

        .floating-element:nth-child(4) {
            bottom: 20%;
            right: 10%;
            font-size: 4.5rem;
            animation-delay: 3s;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            .welcome-title {
                font-size: 3rem;
            }

            .welcome-subtitle {
                font-size: 1.5rem;
            }

            .welcome-name {
                font-size: 2rem;
            }

            .welcome-role {
                font-size: 1.2rem;
            }

            .projects-button {
                padding: 0.8rem 2rem;
                font-size: 1.5rem;
            }

            .floating-element {
                font-size: 3rem !important;
            }
        }

        /* Professional type system */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .welcome-subtitle {
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: #4a7c59;
            margin-bottom: 1rem;
        }

        .welcome-name {
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #2d5016;
            margin-bottom: 0.6rem;
        }

        .welcome-role {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 500;
            color: #4a7c59;
        }

        .projects-button {
            font-family: var(--font-body);
            font-weight: 600;
            letter-spacing: 0.01em;
            box-shadow: 0 8px 24px rgba(45, 80, 22, 0.18);
        }

        @media (max-width: 768px) {
            .welcome-name { font-size: 2.6rem; }
            .welcome-role { font-size: 1.1rem; }
            .welcome-subtitle { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <p class="welcome-subtitle">Hello, I'm</p>
        <h1 class="welcome-name">Erva Şengül</h1>
        <p class="welcome-role">Computer Engineer · AI &amp; Machine Learning</p>
        <a href="main.html" class="projects-button">View Projects</a>
    </div>
</body>
</html>
