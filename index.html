<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Erva Şengül</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Caveat', cursive;
            background: #f5f5f0;
            color: #2d5016;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .welcome-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .welcome-title {
            font-family: "Lobster", sans-serif;
            font-size: 5rem;
            font-weight: 400;
            color: #4a7c59;
            margin-bottom: 1rem;
            transform: rotate(-3deg);
            animation: fadeInDown 1s ease-out;
        }

        .welcome-subtitle {
            font-family: "Lobster", sans-serif;
            font-size: 2rem;
            font-weight: 400;
            color: #2d5016;
            margin-bottom: 1rem;
            transform: rotate(2deg);
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .welcome-name {
            font-family: "Lobster", sans-serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: #4a7c59;
            margin-bottom: 3rem;
            transform: rotate(-1deg);
            animation: fadeInUp 1s ease-out 0.5s backwards;
        }

        .projects-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            background: #4a7c59;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: rotate(-2deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeInUp 1s ease-out 0.7s backwards;
        }

        .projects-button:hover {
            background: #2d5016;
            transform: rotate(0deg) scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* Floating decorative elements */
        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            font-size: 5rem;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 20%;
            right: 15%;
            font-size: 4rem;
            animation-delay: 1s;
        }

        .floating-element:nth-child(3) {
            bottom: 15%;
            left: 20%;
            font-size: 6rem;
            animation-delay: 2s;
        }

        .floating-element:nth-child(4) {
            bottom: 20%;
            right: 10%;
            font-size: 4.5rem;
            animation-delay: 3s;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px) rotate(-3deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(-3deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px) rotate(2deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(2deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        @media (max-width: 768px) {
            .welcome-title {
                font-size: 3rem;
            }

            .welcome-subtitle {
                font-size: 1.5rem;
            }

            .welcome-name {
                font-size: 2rem;
            }

            .projects-button {
                padding: 0.8rem 2rem;
                font-size: 1.5rem;
            }

            .floating-element {
                font-size: 3rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1 class="welcome-title">Welcome!</h1>
        <p class="welcome-subtitle">to the portfolio of</p>
        <h2 class="welcome-name">Erva Şengül</h2>
        <a href="main.html" class="projects-button">Projects</a>
    </div>
</body>
</html>
